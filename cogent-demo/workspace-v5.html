<script src="https://cdn.jsdelivr.net/npm/exceljs@4.4.0/dist/exceljs.min.js"></script><script>
const API='https://cbcgpxtlxqmuzhxkutso.supabase.co/functions/v1/cogent-demo-api', KEY='sb_publishable_RYpkY8vkkmcDPmxv2w6WVQ_c_vww3CD';
const store=localStorage,token=store.getItem('cogent_demo_token');
let user=JSON.parse(store.getItem('cogent_demo_user')||'null'), data=null, view='overview', lastSig='', filter='All', viewMode='Cards', selectedProject='', chatHistory=[];
const stages=['Not started','In progress','Under review','Complete'];
const projectStatuses=['All','In Progress','Planning','Under Review','On Hold','Completed'];
const financeEmails=['kembo@cogent-demo.com','tichaona@cogent-demo.com'];
const $=id=>document.getElementById(id);
const esc=v=>String(v==null?'':v).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const money=n=>new Intl.NumberFormat('en-US',{style:'currency',currency:'USD'}).format(Number(n)||0);
const pretty=d=>d?new Date(d).toLocaleDateString():'—';
function status(p){let x=(p||'').toLowerCase();return x==='active'||x==='in progress'?'In Progress':x==='completed'||x==='complete'?'Completed':x==='under review'?'Under Review':x==='on hold'?'On Hold':'Planning'}
function byid(id){return(data?.users||[]).find(x=>x.id===id)||{}}
function finance(){return data?.finance===true&&financeEmails.includes((user?.email||'').toLowerCase())}
function projects(){return data?.projects||[]}
function tasks(){return data?.tasks||[]}
function invoices(){return data?.invoices||[]}
function balance(i){return Math.max(0,Number(i.amount_usd)-Number(i.amount_paid_usd))}
function invState(i){if(balance(i)<.01)return 'Paid';return new Date(i.due_date+'T23:59:59')<new Date()?'Overdue':'Due'}
function note(t){const node=$('toast');node.textContent=t;node.classList.add('show');setTimeout(()=>node.classList.remove('show'),2400)}
async function api(action,payload={}){const r=await fetch(API,{method:'POST',headers:{'Content-Type':'application/json','apikey':KEY,'Authorization':'Bearer '+KEY,'x-cogent-session':token},body:JSON.stringify({action,token,...payload})});const j=await r.json();if(r.status===401){store.removeItem('cogent_demo_token');store.removeItem('cogent_demo_user');location.replace('/login/');throw Error('Session expired')}if(!r.ok)throw Error(j.error||'Request failed');return j}
function title(text,sub,btn=''){return '<div class="space"><div><h2 class="section-title">'+text+'</h2><p class="section-sub">'+sub+'</p></div>'+btn+'</div>'}
const clientNav=[['overview','Overview'],['tickets','My Tickets'],['projects','Projects'],['invoices','Payments & Invoices'],['knowledge','Help Centre'],['assistant','Cogent Assist']];
const staffNav=[['overview','Overview'],['tickets','Tickets'],['projects','Projects'],['consultants','Consultants'],['board','Ticket Board'],['clients','Client 360'],['messages','Messages'],['smsalerts','SMS Alerts'],['knowledge','Knowledge Base'],['assistant','Cogent Assist'],['crm','CRM Pipeline'],['reports','Reports']];
function navList(){const n=user?.role==='client'?clientNav:[...staffNav.slice(0,6),...(finance()?[['invoices','Invoicing'],['sms','SMS Centre']]:[]),...staffNav.slice(6)];return n}
function nav(){const groups=navList();$('nav').innerHTML='<div class="nav-group">'+(user?.role==='client'?'CLIENT PORTAL':'COGENT OPERATIONS')+'</div>'+groups.map(x=>'<button class="navlink '+(view===x[0]?'active':'')+'" data-view="'+x[0]+'">'+x[1]+'</button>').join('')}
function stats(){let t=data.tickets||[],p=projects(),a=invoices().filter(i=>balance(i)>.01),s=[
['Open Tickets',t.filter(i=>!['Closed','Resolved'].includes(i.status)).length,'Shared service queue'],
['Projects In Progress',p.filter(i=>status(i.status)==='In Progress').length,'Active delivery work'],
['Payments Due',money(a.reduce((sum,i)=>sum+balance(i),0)),'Outstanding invoices'],
[user.role==='client'?'Project Tasks':'Team Members',user.role==='client'?tasks().length:data.users.filter(u=>u.role==='staff').length,'Current account']
];return '<div class="stats">'+s.map(x=>'<div class="stat"><label>'+x[0]+'</label><b>'+x[1]+'</b><small>'+x[2]+'</small></div>').join('')+'</div>'}
function overview(){const t=data.tickets||[];const ticketRows=t.slice(0,5).map(x=>'<tr><td><strong>'+esc(x.ticket_no)+'</strong><br>'+esc(x.subject)+'</td><td>'+esc(x.client_org)+'</td><td><span class="badge '+x.priority.toLowerCase()+'">'+esc(x.priority)+'</span></td><td>'+esc(x.status)+'</td><td><button class="btn light" data-open-ticket="'+x.id+'">View</button></td></tr>').join('');return title('Service Overview','A single view of client requests, ongoing projects and billing.')+stats()+'<div class="columns"><div class="card"><div class="card-head"><h3>Priority Requests</h3><button class="btn light" data-view="tickets">View all</button></div><div class="table-wrap"><table><thead><tr><th>Ticket</th><th>Client</th><th>Priority</th><th>Status</th><th></th></tr></thead><tbody>'+ticketRows+'</tbody></table></div></div><div class="card pad"><h3 style="font-size:15px">Project Delivery</h3><p class="section-sub">Current progress across your visible projects</p>'+projects().slice(0,4).map(p=>'<div class="list-item"><b>'+esc(p.name)+'</b><div class="progress"><div style="width:'+p.progress+'%"></div></div><p>'+esc(p.client_org)+' · '+p.progress+'% complete</p></div>').join('')+'</div></div>'}

const closedStatus=t=>['Resolved','Closed'].includes(t.status);
const workStats=()=>{
 const all=data.tickets||[], resolved=all.filter(closedStatus),open=all.filter(t=>!closedStatus(t));
 const responded=all.filter(t=>t.first_response_at&&t.response_due_at);
 const slaHit=responded.filter(t=>new Date(t.first_response_at)<=new Date(t.response_due_at));
 const firstMins=responded.map(t=>(new Date(t.first_response_at)-new Date(t.created_at))/60000).filter(x=>Number.isFinite(x)&&x>=0);
 const now=Date.now(),weekStart=now-7*86400000;
 return {
  total:all.length,open:open.length, resolved:resolved.length,
  resolvedWeek:resolved.filter(t=>t.resolved_at&&new Date(t.resolved_at).getTime()>=weekStart).length,
  resolutionRate:all.length?100*resolved.length/all.length:0,
  sla:responded.length?100*slaHit.length/responded.length:null,
  slaSample:responded.length,
  avgFirstMinutes:firstMins.length?firstMins.reduce((a,b)=>a+b,0)/firstMins.length:null
 };
};
function consultantRows(){
 return (data.users||[]).filter(u=>u.role==='staff').map(u=>{
  const mine=data.tickets.filter(t=>t.assigned_to===u.id),open=mine.filter(t=>!closedStatus(t)),resolved=mine.filter(closedStatus);
  const time=(data.timeEntries||[]).filter(t=>t.user_id===u.id);
  return {id:u.id,name:u.name,total:mine.length,open:open.length,resolved:resolved.length,
   rate:mine.length?resolved.length/mine.length*100:0,
   high:open.filter(t=>['High','Urgent','Critical'].includes(t.priority)).length,
   breach:open.filter(t=>t.response_due_at&&!t.first_response_at&&Date.parse(t.response_due_at)-Date.now()<3600000).length,
   minutes:time.reduce((a,t)=>a+Number(t.minutes||0),0)
  }
 });
}

function requestData(t){

 const deadline=t.response_due_at||t.sla_due, sla=t.first_response_at?(deadline&&new Date(t.first_response_at)<=new Date(deadline)?'Met':'Breached'):

 return [t.ticket_no,t.subject,t.client_org,byid(t.client_user_id).name||'',t.category,t.priority,t.status,

}

 s.autoFilter={from:'A1',to:s.getRow(1).getCell(headers.length).address};
 s.getRow(1).height=27;s.getRow(1).eachCell(c=>{c.fill={type:'pattern',pattern:'solid',fgColor:{argb:'FF15161A'}};c.font={bold:true,color:{argb:'FFF3D27C'}};c.alignment={vertical:'middle'}});
 s.columns.forEach((c,i)=>c.width=Math.max(14,Math.min(42,headers[i].length+10)));
 return s};
 add('Summary',['Metric','Value'],[['Open requests',k.open],['Resolved this week',k.resolvedWeek],['Within SLA %',k.sla===null?'Unknown':k.sla/100],['Average first response (min)',k.avgFirstMinutes??'Unknown'],['Period','All demo records'],['Exported at',new Date().toISOString()],['Exported by',user.name]]);

 r.getCell(6).font={bold:true,color:{argb:r.getCell(6).value==='Urgent'?'FFFF7B72':'FFD9AE3F'}};
 });

}
function clients(){let orgs=[...new Set([...data.tickets.map(x=>x.client_org),...projects().map(x=>x.client_org),...invoices().map(x=>x.client_org)])];return title('Client 360','Service requests, delivery and billing context by institution.')+'<div class="cards">'+orgs.map(o=>'<div class="card pad"><h3>'+esc(o)+'</h3><div class="list-item"><b>'+data.tickets.filter(t=>t.client_org===o).length+' tickets</b></div><div class="list-item"><b>'+projects().filter(p=>p.client_org===o).length+' projects</b></div>'+(finance()?'<div class="list-item"><b>'+money(invoices().filter(i=>i.client_org===o).reduce((a,i)=>a+balance(i),0))+' due</b></div>':'')+'</div>').join('')+'</div>'}
function mock(name){return title(name,'This commercial workspace is available for Cogent service operations.')+'<div class="card pad"><h3>'+name+'</h3><p class="section-sub">Service desk tickets, project plans and invoices are connected to Supabase. This additional business workflow can be integrated with the live data model next.</p></div>'}
function messages(){return title('Messages','External replies and internal collaboration notes.')+'<div class="card pad"><div class="list">'+data.messages.slice().reverse().map(m=>'<div class="list-item"><b>'+esc(byid(m.author_user_id).name||'User')+'</b><span class="badge">'+esc(m.visibility)+'</span><p>'+esc(m.body)+'</p></div>').join('')+'</div></div>'}
function render(){if(!data)return;let labels={overview:'Overview',tickets:'Tickets',projects:'Projects',invoices:'Invoices',sms:'SMS Centre',smsalerts:'SMS Alerts',knowledge:'Help Centre',assistant:'Cogent Assist',reports:'Reports',clients:'Client 360',consultants:'Consultants',board:'Ticket Board',messages:'Messages',crm:'CRM Pipeline'};$('title').textContent=labels[view]||'Cogent Desk';nav();let map={overview,tickets,consultants,board,projects:projectContent,invoices:billing,sms,smsalerts,knowledge:help,assistant,reports,clients,messages,crm:()=>mock('CRM Pipeline')};$('content').innerHTML=(map[view]||overview)();if(view==='assistant'){let el=$('chatFeed');el.scrollTop=el.scrollHeight}}
async function refresh(silent=false){try{const j=await api('bootstrap');data=j;user=j.user;store.setItem('cogent_demo_user',JSON.stringify(user));$('who').textContent=user.name;$('org').textContent=user.organization;const sig=JSON.stringify([j.tickets.map(x=>[x.id,x.updated_at]),j.projects.map(x=>[x.id,x.status,x.progress]),j.tasks.map(x=>[x.id,x.updated_at]),j.invoices.map(x=>[x.id,x.updated_at]),j.sms.length,(j.notification_events||[]).map(x=>[x.id,x.status]),j.notification_prefs]);if(sig!==lastSig){lastSig=sig;if(!$('modal').classList.contains('show'))render();else nav()}}catch(e){if(!silent)$('content').innerHTML='<div class="card pad"><strong>Connection problem</strong><p>'+esc(e.message)+'</p><button class="btn gold" onclick="refresh()">Retry</button></div>'}}
function showModal(title,content){$('mtitle').textContent=title;$('mbody').innerHTML=content;$('modal').classList.add('show')}
function closeModal(){$('modal').classList.remove('show')}
function field(label,id,value='',type='text'){return '<div class="field"><label>'+label+'</label><input class="input w100" id="'+id+'" type="'+type+'" value="'+esc(value)+'" required></div>'}
function select(label,id,items,value=''){return '<div class="field"><label>'+label+'</label><select class="input w100" id="'+id+'">'+items.map(x=>'<option value="'+esc(x[0])+'" '+(value===x[0]?'selected':'')+'>'+esc(x[1])+'</option>').join('')+'</select></div>'}
function staffOptions(value=''){return [['','Unassigned'],...data.users.filter(x=>x.role==='staff').map(x=>[x.id,x.name])]}
function newTicket(){showModal('Create Support Request','<form id="newTicketForm" class="kv">'+field('Subject','subject')+select('Category','category',['Temenos Support','Systems Integration','COGBI / AML','Access','General Support'].map(x=>[x,x]))+select('Priority','priority',['Normal','High','Urgent'].map(x=>[x,x]))+'<div class="field full"><label>Description</label><textarea id="description" class="input w100" required></textarea></div><div class="field full"><button class="btn gold">Submit Request</button></div></form>')}
function openTicket(id){const t=data.tickets.find(x=>x.id===id);if(!t)return;const controls=user.role==='client'?'':'<div class="kv">'+select('Status','ticketStatus',['Open','In progress','Waiting on Client','Under review','Resolved','Closed'].map(x=>[x,x]),t.status)+select('Priority','ticketPriority',['Normal','High','Urgent'].map(x=>[x,x]),t.priority)+select('Assign to','ticketOwner',staffOptions(),t.assigned_to||'')+'<div class="field"><label>Update</label><button class="btn gold" data-save-ticket="'+t.id+'">Save Changes</button></div></div><div class="sep"></div>';const msgs=data.messages.filter(m=>m.ticket_id===id).map(m=>'<div class="message '+(m.visibility==='internal'?'internal':'')+'"><strong>'+esc(byid(m.author_user_id).name||'User')+'</strong> · '+esc(m.visibility)+' · '+pretty(m.created_at)+'<p>'+esc(m.body)+'</p></div>').join('');showModal(t.ticket_no+' · '+t.subject,'<p class="section-sub">'+esc(t.description)+'</p><div class="pillrow"><span class="badge">'+esc(t.priority)+'</span><span class="badge">'+esc(t.status)+'</span><span class="badge">SLA: '+pretty(t.sla_due)+'</span></div><div class="sep"></div>'+controls+msgs+'<form id="replyForm" data-ticket="'+t.id+'" class="kv"><div class="field full"><label>Reply</label><textarea class="input w100" id="reply" required></textarea></div>'+(user.role==='client'?'':select('Visibility','visibility',[['external','Client reply'],['internal','Private team note']])+field('Minutes worked (optional)','minutes','0','number'))+'<div class="field full"><button class="btn gold">Post Message</button></div></form>')}
function kb(id){let a=data.knowledge.find(x=>x.id===id);if(!a)return;showModal(a.title,'<p class="section-sub">'+esc(a.symptoms)+'</p><ol class="faq-steps">'+(a.steps||[]).map(s=>'<li>'+esc(s)+'</li>').join('')+'</ol><p class="notice">'+esc(a.caution)+'</p><button class="btn gold" data-new-ticket>Still need help? Open a ticket</button>')}
function projectModal(id){const p=projects().find(x=>x.id===id);if(!p)return;selectedProject=id;viewMode='Storyboard';filter='All';closeModal();render()}
function printInvoice(id){const i=invoices().find(x=>x.id===id);if(!i)return;showModal('Invoice '+i.invoice_no,'<div class="card pad"><h3>Cogent Technology Associates</h3><div class="sep"></div><p class="section-sub">Invoice No. '+esc(i.invoice_no)+'<br>Client: '+esc(i.client_org)+'<br>Description: '+esc(i.description)+'<br>Issued: '+pretty(i.issued_date)+'<br>Due: '+pretty(i.due_date)+'</p><h2>'+money(i.amount_usd)+'</h2><p class="section-sub">Paid: '+money(i.amount_paid_usd)+' · Outstanding: '+money(balance(i))+'</p><button class="btn light" onclick="window.print()">Print</button></div>')}
function newInvoice(){showModal('Create Invoice','<form id="invoiceForm" class="kv">'+field('Institution','billOrg')+field('Description','billDescription')+field('Amount (USD)','billAmount','0','number')+field('Due date','billDue','','date')+'<div class="field full"><button class="btn gold">Create Invoice</button></div></form>')}
function newSms(invoiceId=''){let inv=invoices().find(x=>x.id===invoiceId);let suggested=inv?'Cogent reminder: '+inv.invoice_no+' has '+money(balance(inv))+' outstanding, due '+pretty(inv.due_date)+'. Contact enquiries@cogent-technology.com if already paid.':'Cogent Technology service update: please contact our team for more information.';showModal('Compose SMS Draft','<form id="smsForm" class="kv">'+field('Institution','smsOrg',inv?.client_org||'')+field('Recipient number (optional)','smsPhone')+field('Subject','smsSubject',inv?'Payment reminder':'Service update')+'<div class="field full"><label>Message</label><textarea class="input w100" id="smsText" maxlength="500" required>'+esc(suggested)+'</textarea></div><input type="hidden" id="smsInvoiceId" value="'+(inv?.id||'')+'"><div class="field full"><p class="notice">Draft only. SMS delivery is not connected.</p><button class="btn gold">Save Draft</button></div></form>')}
function newProject(){showModal('New Project','<form id="newProjectForm" class="kv">'+field('Project title','prTitle')+field('Client institution','prOrg')+select('Service','prService',['Support & Stabilisation','Core Banking Implementation','Systems Integration','Legacy System Migration','COGBI','Custom Development'].map(x=>[x,x]))+select('Project owner','prOwner',staffOptions(),user.id)+field('Target date','prDue','','date')+'<div class="field full"><button class="btn gold">Create Project</button></div></form>')}
function newTask(id){showModal('Add Task','<form id="newTaskForm" class="kv" data-project="'+id+'">'+field('Task description','taskTitle')+select('Assign to','taskOwner',staffOptions())+select('Priority','taskPriority',['Normal','High','Urgent'].map(x=>[x,x]))+field('Due date','taskDue','','date')+'<div class="field full"><button class="btn gold">Add Task</button></div></form>')}
async function ask(q){chatHistory.push({who:'user',content:esc(q)});render();try{const d=await api('ask_support',{question:q});let html='<strong>'+esc(d.answer)+'</strong>'+(d.matches||[]).map(a=>'<div class="sep"></div><b>'+esc(a.title)+'</b><ol class="faq-steps">'+(a.steps||[]).map(x=>'<li>'+esc(x)+'</li>').join('')+'</ol><p class="section-sub">'+esc(a.caution)+'</p>').join('');chatHistory.push({who:'bot',content:html})}catch(e){chatHistory.push({who:'bot',content:esc(e.message)})}render()}
document.addEventListener('click',async e=>{let b=e.target.closest('button');if(!b)return;try{
if(b.dataset.view){view=b.dataset.view;render()}
else if(b.dataset.export){if(b.dataset.export==="csv")csvExport();else await xlsxExport()}
else if(b.dataset.projectTab){filter=b.dataset.projectTab;render()}
else if(b.dataset.projectMode){viewMode=b.dataset.projectMode;render()}
else if(b.dataset.openProject)projectModal(b.dataset.openProject)
else if(b.dataset.openTicket)openTicket(b.dataset.openTicket)
else if(b.dataset.newTicket!==undefined)newTicket()
else if(b.dataset.newInvoice!==undefined)newInvoice()
else if(b.dataset.newSms!==undefined)newSms()
else if(b.dataset.newProject!==undefined)newProject()
else if(b.dataset.newTask)newTask(b.dataset.newTask)
else if(b.dataset.openKb)kb(b.dataset.openKb)
else if(b.dataset.printInvoice)printInvoice(b.dataset.printInvoice)
else if(b.dataset.recordPayment){showModal('Record Invoice Payment','<form id="payForm" data-invoice="'+b.dataset.recordPayment+'">'+field('Payment received (USD)','payAmount','0','number')+'<button class="btn gold" style="margin-top:12px">Record Payment</button></form>')}
else if(b.dataset.remind)newSms(b.dataset.remind)
else if(b.dataset.ask)ask(b.dataset.ask)
else if(b.dataset.saveTicket){await api('update_ticket',{ticket_id:b.dataset.saveTicket,status:$('ticketStatus').value,priority:$('ticketPriority').value,assigned_to:$('ticketOwner').value});closeModal();note('Ticket updated');await refresh()}
}catch(err){note(err.message)}});
document.addEventListener('change',async e=>{const t=e.target;try{
if(t.id==='projectPick'){selectedProject=t.value;render()}
else if(t.dataset.projectStatus){await api('update_project',{project_id:t.dataset.projectStatus,status:t.value});note('Project status updated');await refresh()}
else if(t.dataset.taskStage){await api('update_task',{task_id:t.dataset.taskStage,status:t.value});note('Task moved');await refresh()}
}catch(err){note(err.message)}});
document.addEventListener('input',e=>{if(e.target.id==='reportSearch'){window.reportSearch=e.target.value;render();const node=$('reportSearch');node?.focus();return}if(e.target.id==='kbSearch'){window.helpQuery=e.target.value;let caret=e.target.selectionStart;render();let node=$('kbSearch');node?.focus();node?.setSelectionRange(caret,caret)}});
document.addEventListener('dragstart',e=>{const t=e.target.closest('[data-ticket-drag]');if(t&&user.role!=='client'){e.dataTransfer.setData('application/cogent-ticket',t.dataset.ticketDrag);return}const story=e.target.closest('.story');if(story&&user.role!=='client'){e.dataTransfer.setData('text/plain',story.dataset.taskId)}});
document.addEventListener('dragover',e=>{if(e.target.closest('[data-ticket-lane]')&&user.role!=='client'){e.preventDefault();return}const lane=e.target.closest('.lane');if(lane&&user.role!=='client'){e.preventDefault();lane.classList.add('drop')}});
document.addEventListener('dragleave',e=>{const lane=e.target.closest('.lane');if(lane)lane.classList.remove('drop')});
document.addEventListener('drop',async e=>{const laneTicket=e.target.closest('[data-ticket-lane]');if(laneTicket&&user.role!=='client'){e.preventDefault();const id=e.dataTransfer.getData('application/cogent-ticket');if(id){try{await api('update_ticket',{ticket_id:id,status:laneTicket.dataset.ticketLane==='New'?'Open':laneTicket.dataset.ticketLane==='Waiting on client'?'Waiting on Client':laneTicket.dataset.ticketLane});await refresh();note('Ticket moved')}catch(err){note(err.message)}}return}const lane=e.target.closest('.lane');if(!lane||user.role==='client')return;e.preventDefault();lane.classList.remove('drop');const id=e.dataTransfer.getData('text/plain');if(!id)return;try{await api('update_task',{task_id:id,status:lane.dataset.stage});note('Storyboard updated');await refresh()}catch(err){note(err.message)}});
document.addEventListener('submit',async e=>{const f=e.target;if(!['newTicketForm','replyForm','chatForm','invoiceForm','payForm','smsForm','newProjectForm','newTaskForm','smsPrefsForm'].includes(f.id))return;e.preventDefault();try{
if(f.id==='newTicketForm')await api('create_ticket',{subject:$('subject').value,category:$('category').value,priority:$('priority').value,description:$('description').value});
if(f.id==='replyForm'){await api('add_message',{ticket_id:f.dataset.ticket,body:$('reply').value,visibility:user.role==='client'?'external':$('visibility').value});if(user.role!=='client'&&Number($('minutes').value)>0)await api('add_time',{ticket_id:f.dataset.ticket,minutes:Number($('minutes').value),note:'Ticket response'})}
if(f.id==='chatForm'){const q=$('chatInput').value;await ask(q);return}
if(f.id==='invoiceForm')await api('create_invoice',{client_org:$('billOrg').value,description:$('billDescription').value,amount_usd:Number($('billAmount').value),due_date:$('billDue').value});
if(f.id==='payForm')await api('record_invoice_payment',{invoice_id:f.dataset.invoice,amount_usd:Number($('payAmount').value)});
if(f.id==='smsPrefsForm')await api('update_my_sms_preferences',{
 phone:$('mySmsNumber').value,enabled:$('mySmsEnabled').checked,
 new_ticket:$('mySmsTicket').checked,task_assigned:$('mySmsTask').checked
});
if(f.id==='smsForm')await api('create_sms_draft',{client_org:$('smsOrg').value,to_phone:$('smsPhone').value,subject:$('smsSubject').value,content:$('smsText').value,invoice_id:$('smsInvoiceId').value||null});
if(f.id==='newProjectForm')await api('create_project',{name:$('prTitle').value,client_org:$('prOrg').value,service:$('prService').value,owner_user_id:$('prOwner').value,target_date:$('prDue').value||null});
if(f.id==='newTaskForm')await api('create_task',{project_id:f.dataset.project,title:$('taskTitle').value,assigned_to:$('taskOwner').value,priority:$('taskPriority').value,due_date:$('taskDue').value||null});
closeModal();note('Saved successfully');await refresh()
}catch(err){note(err.message)}});
$('mclose').onclick=closeModal;$('modal').addEventListener('click',e=>{if(e.target.id==='modal')closeModal()});
$('logout').onclick=async()=>{try{await api('logout')}catch{}store.removeItem('cogent_demo_token');store.removeItem('cogent_demo_user');location.replace('/login/')};
if(!token||!user){location.replace('/login/')}else{nav();refresh();setInterval(()=>{if(!$('modal').classList.contains('show'))refresh(true)},5000)}
</script></body></html>
